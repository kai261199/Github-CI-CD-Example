<div class="mx-auto flex h-dvh max-w-6xl flex-col px-4 py-6 sm:px-6">
    <!-- Header -->
    <header class="mb-5 flex shrink-0 items-center justify-between">
        <div class="flex items-center gap-3">
            <div
                class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 text-white shadow-lg shadow-indigo-500/30">
                <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 11l3 3L22 4" />
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white">Flow</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Stay on top of your day</p>
            </div>
        </div>

        <button type="button" (click)="toggleTheme()"
            class="group flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200/80 bg-white/80 text-slate-600 shadow-sm backdrop-blur-sm transition hover:bg-white hover:text-indigo-500 dark:border-slate-800/80 dark:bg-slate-900/70 dark:text-slate-300 dark:hover:text-indigo-400"
            [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
            title="Toggle theme">
            @if (theme() === 'dark') {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" />
                <path
                    d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
            </svg>
            } @else {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            }
        </button>
    </header>

    <div class="flex min-h-0 flex-1 flex-col gap-4 lg:flex-row lg:gap-6">
        <!-- Left: monitor + quick add -->
        <aside class="no-scrollbar flex shrink-0 flex-col gap-4 lg:w-80 lg:overflow-y-auto lg:pr-1">
            <app-dashboard />
            <app-todo-form />
        </aside>

        <!-- Right: filters + scrollable task list -->
        <div class="flex min-h-0 flex-1 flex-col">
            <app-filter-bar />
            <div class="no-scrollbar mt-4 min-h-0 flex-1 overflow-y-auto pr-1">
                <app-todo-list />
            </div>
        </div>
    </div>

    <footer class="mt-4 shrink-0 text-center text-[11px] text-slate-400 dark:text-slate-600">
        Built with Angular · Deployed via GitHub Actions
    </footer>
</div>
