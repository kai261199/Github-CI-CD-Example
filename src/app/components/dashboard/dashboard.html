<section class="surface overflow-hidden p-5">
    <div class="flex items-start justify-between gap-4">
        <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Progress</p>
            <div class="mt-1 flex items-baseline gap-2">
                <span class="text-3xl font-extrabold text-slate-900 dark:text-white">{{ stats().percentComplete
                    }}%</span>
                <span class="text-xs text-slate-500 dark:text-slate-400">
                    {{ stats().completed }} of {{ stats().total }} done
                </span>
            </div>
        </div>

        <!-- Priority chips -->
        <div class="hidden gap-1.5 sm:flex">
            <span
                class="inline-flex items-center gap-1.5 rounded-full bg-rose-50 px-2.5 py-1 text-xs font-semibold text-rose-600 dark:bg-rose-500/10 dark:text-rose-300">
                <span class="h-1.5 w-1.5 rounded-full bg-rose-500"></span>{{ stats().byPriority.high }}
            </span>
            <span
                class="inline-flex items-center gap-1.5 rounded-full bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-600 dark:bg-amber-500/10 dark:text-amber-300">
                <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>{{ stats().byPriority.medium }}
            </span>
            <span
                class="inline-flex items-center gap-1.5 rounded-full bg-sky-50 px-2.5 py-1 text-xs font-semibold text-sky-600 dark:bg-sky-500/10 dark:text-sky-300">
                <span class="h-1.5 w-1.5 rounded-full bg-sky-500"></span>{{ stats().byPriority.low }}
            </span>
        </div>
    </div>

    <!-- Progress bar -->
    <div class="mt-3 h-2 w-full overflow-hidden rounded-full bg-slate-200/80 dark:bg-slate-800">
        <div class="h-full rounded-full bg-gradient-to-r from-indigo-500 via-violet-500 to-fuchsia-500 transition-all duration-500"
            [style.width.%]="stats().percentComplete"></div>
    </div>

    <!-- Stat tiles -->
    <div class="mt-5 grid grid-cols-3 gap-3">
        <div class="rounded-xl bg-slate-50/80 p-3 text-center dark:bg-slate-800/50">
            <p class="text-2xl font-bold text-indigo-600 dark:text-indigo-400">{{ stats().active }}</p>
            <p class="mt-0.5 text-[11px] font-medium uppercase tracking-wide text-slate-400">Active</p>
        </div>
        <div class="rounded-xl bg-slate-50/80 p-3 text-center dark:bg-slate-800/50">
            <p class="text-2xl font-bold text-emerald-600 dark:text-emerald-400">
                {{ stats().completed }}
            </p>
            <p class="mt-0.5 text-[11px] font-medium uppercase tracking-wide text-slate-400">Done</p>
        </div>
        <div class="rounded-xl p-3 text-center" [class]="
        stats().overdue > 0
          ? 'bg-rose-50 dark:bg-rose-500/10'
          : 'bg-slate-50/80 dark:bg-slate-800/50'
      ">
            <p class="text-2xl font-bold" [class]="
          stats().overdue > 0
            ? 'text-rose-600 dark:text-rose-400'
            : 'text-slate-500 dark:text-slate-400'
        ">
                {{ stats().overdue }}
            </p>
            <p class="mt-0.5 text-[11px] font-medium uppercase tracking-wide text-slate-400">Overdue</p>
        </div>
    </div>
</section>
