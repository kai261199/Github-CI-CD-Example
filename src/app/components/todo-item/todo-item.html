<div class="surface group relative flex gap-3 overflow-hidden p-3.5 transition duration-200 hover:-translate-y-0.5 hover:shadow-md"
    [class.opacity-60]="todo().completed">
    <!-- Priority accent -->
    <span class="absolute inset-y-0 left-0 w-1 transition-opacity" [class]="accentClass()"
        [class.opacity-30]="todo().completed"></span>

    <!-- Checkbox -->
    <button type="button" (click)="toggle()"
        class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2 transition" [class]="
      todo().completed
        ? 'border-emerald-500 bg-emerald-500 text-white'
        : 'border-slate-300 text-transparent hover:border-indigo-400 dark:border-slate-600'
    " [attr.aria-pressed]="todo().completed" aria-label="Toggle complete">
        <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5" />
        </svg>
    </button>

    <div class="min-w-0 flex-1">
        @if (!editing()) {
        <!-- Read view -->
        <div class="flex items-start justify-between gap-2">
            <p class="break-words text-sm font-medium text-slate-900 dark:text-white"
                [class.line-through]="todo().completed" [class.text-slate-400]="todo().completed">
                {{ todo().title }}
            </p>
            <div
                class="flex shrink-0 items-center gap-0.5 opacity-0 transition group-hover:opacity-100 focus-within:opacity-100">
                <button type="button" (click)="startEdit()"
                    class="rounded-lg p-1.5 text-slate-400 transition hover:bg-slate-100 hover:text-indigo-600 dark:hover:bg-slate-800 dark:hover:text-indigo-400"
                    aria-label="Edit" title="Edit">
                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
                    </svg>
                </button>
                <button type="button" (click)="remove()"
                    class="rounded-lg p-1.5 text-slate-400 transition hover:bg-rose-50 hover:text-rose-600 dark:hover:bg-rose-500/10 dark:hover:text-rose-400"
                    aria-label="Delete" title="Delete">
                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    </svg>
                </button>
            </div>
        </div>

        @if (todo().notes) {
        <p class="mt-1 whitespace-pre-line text-xs text-slate-500 dark:text-slate-400">
            {{ todo().notes }}
        </p>
        }

        <div class="mt-2 flex flex-wrap items-center gap-1.5">
            <span class="rounded-md px-2 py-0.5 text-[11px] font-semibold capitalize" [class]="priorityClasses()">
                {{ todo().priority }}
            </span>

            @if (todo().dueDate) {
            <span class="inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-[11px] font-medium" [class]="
              isOverdue()
                ? 'bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300'
                : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'
            ">
                <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" />
                    <path d="M16 2v4M8 2v4M3 10h18" />
                </svg>
                {{ formatDate(todo().dueDate!) }}
                @if (isOverdue()) {
                <span class="font-semibold">· overdue</span>
                }
            </span>
            }

            @for (tag of todo().tags; track tag) {
            <span
                class="rounded-md bg-indigo-50 px-2 py-0.5 text-[11px] font-medium text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-300">
                #{{ tag }}
            </span>
            }
        </div>
        } @else {
        <!-- Edit view -->
        <div class="grid gap-2">
            <input type="text" [ngModel]="draftTitle()" (ngModelChange)="draftTitle.set($event)"
                (keydown.enter)="saveEdit()" (keydown.escape)="cancelEdit()" class="field" />
            <div class="grid gap-2 sm:grid-cols-2">
                <select [ngModel]="draftPriority()" (ngModelChange)="draftPriority.set($event)"
                    class="field capitalize">
                    @for (p of priorities; track p) {
                    <option [value]="p" class="capitalize">{{ p }}</option>
                    }
                </select>
                <input type="date" [ngModel]="draftDueDate()" (ngModelChange)="draftDueDate.set($event)"
                    class="field" />
            </div>
            <input type="text" [ngModel]="draftTags()" (ngModelChange)="draftTags.set($event)"
                placeholder="tags, comma separated" class="field" />
            <textarea rows="2" [ngModel]="draftNotes()" (ngModelChange)="draftNotes.set($event)" placeholder="Notes…"
                class="field resize-none"></textarea>
            <div class="flex justify-end gap-2">
                <button type="button" (click)="cancelEdit()"
                    class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-500 transition hover:text-slate-700 dark:hover:text-slate-200">
                    Cancel
                </button>
                <button type="button" (click)="saveEdit()"
                    class="rounded-lg bg-indigo-600 px-4 py-1.5 text-sm font-semibold text-white shadow-sm shadow-indigo-500/25 transition hover:bg-indigo-500 active:scale-95">
                    Save
                </button>
            </div>
        </div>
        }
    </div>
</div>
