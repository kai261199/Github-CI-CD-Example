name: Release

# Triggered when you push a semantic version tag, e.g. `git tag v1.0.0 && git push --tags`.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, test & build
        run: |
          npm run lint
          npm run test:ci
          npm run build -- --base-href="/${{ github.event.repository.name }}/"

      # Package the built app so it can be attached to the release.
      - name: Archive build output
        run: |
          cd dist/todo-app/browser
          zip -r "../../../flow-${{ github.ref_name }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: flow-${{ github.ref_name }}.zip
