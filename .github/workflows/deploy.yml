name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & test
        run: |
          npm run lint
          npm run test:ci

      # base-href must match the repository name so assets resolve on
      # https://<user>.github.io/<repo>/
      - name: Build (production)
        run: npm run build -- --base-href="/${{ github.event.repository.name }}/"

      # SPA fallback + disable Jekyll processing.
      - name: Prepare Pages artifact
        run: |
          cp dist/todo-app/browser/index.html dist/todo-app/browser/404.html
          touch dist/todo-app/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/todo-app/browser

  deploy:
    name: Deploy
    # Wait for the build job to finish before deploying.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
